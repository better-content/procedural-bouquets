plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'jacoco'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            arg '--nogui'
        }

        gameTestServer {}

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (file('src/gameteststructures').exists()) {
    tasks.register('syncGameTestStructures', Copy) {
        from('src/gameteststructures')
        into(project.file('run/gameteststructures'))
    }

    tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
        dependsOn(tasks.named('syncGameTestStructures'))
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraftVersion: minecraft_version,
        forgeVersion: forge_version,
        modId: mod_id,
        modName: mod_name,
        modVersion: mod_version,
        modAuthors: mod_authors,
        modDescription: mod_description,
        modIssueTrackerUrl: mod_issue_tracker_url,
        modLicense: mod_license
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs Forge game tests in a headless dedicated server.'
    dependsOn tasks.named('runGameTestServer')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, include: ['com/example/proceduralbouquets/data/**'])
        })
    )
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(tasks.named('jacocoTestReport', JacocoReport).map { it.classDirectories })
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.55
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
