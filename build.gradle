plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'jacoco'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'procedural-bouquets'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    visualHarness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    visualHarnessImplementation.extendsFrom implementation
    visualHarnessRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        visualHarness {
            parent minecraft.runs.client
            client true
            workingDirectory project.file('run-visual-harness')
            property 'forge.logging.console.level', 'info'
            property 'procedural_bouquets.visualHarness', 'true'
            args '--width', '1600', '--height', '900'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.visualHarness
                }
            }
        }

        server {
            arg '--nogui'
        }

        gameTestServer {}

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (file('src/gameteststructures').exists()) {
    tasks.register('syncGameTestStructures', Copy) {
        from('src/gameteststructures')
        into(project.file('run/gameteststructures'))
    }

    tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
        dependsOn(tasks.named('syncGameTestStructures'))
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraftVersion: minecraft_version,
        forgeVersion: forge_version,
        modId: mod_id,
        modName: mod_name,
        modVersion: mod_version,
        modAuthors: mod_authors,
        modDescription: mod_description,
        modIssueTrackerUrl: mod_issue_tracker_url,
        modLicense: mod_license
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs Forge game tests in a headless dedicated server.'
    dependsOn tasks.named('runGameTestServer')
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs deterministic unit/resource checks without Forge game tests.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs the full verification lane including headless Forge game tests.'
    dependsOn tasks.named('verifyFast')
    dependsOn tasks.named('headlessGameTest')
}

tasks.register('prepareVisualHarnessOptions', Copy) {
    group = 'verification'
    description = 'Installs deterministic client settings and clears prior bouquet visual evidence.'
    from 'src/visualHarness/options.txt'
    into 'run-visual-harness'
    doFirst {
        delete fileTree('run-visual-harness/screenshots') {
            include '01-grid.png', '02-bouquet-item.png', '03-potted-item.png', '04-potted-block.png'
        }
        delete 'run-visual-harness/visual-harness-complete.json'
    }
}

tasks.configureEach {
    if (name == 'runVisualHarness') {
        dependsOn tasks.named('prepareVisualHarnessOptions')
    }
}

tasks.register('verifyVisualHarness') {
    group = 'verification'
    description = 'Runs the isolated bouquet renderer and verifies that every visual evidence file was captured.'
    dependsOn tasks.named('runVisualHarness')
    doLast {
        def root = file('run-visual-harness')
        def captures = [
            'screenshots/01-grid.png',
            'screenshots/02-bouquet-item.png',
            'screenshots/03-potted-item.png',
            'screenshots/04-potted-block.png'
        ]
        def digests = [] as Set
        captures.each { relative ->
            def evidence = new File(root, relative)
            if (!evidence.isFile() || evidence.length() == 0L) {
                throw new GradleException("Visual harness did not produce ${relative}")
            }
            def image = javax.imageio.ImageIO.read(evidence)
            if (image == null || image.width != 1600 || image.height != 900) {
                throw new GradleException("Visual harness produced an invalid 1600x900 PNG for ${relative}")
            }
            def sampledColors = [] as Set
            for (int y = 0; y < image.height; y += 20) {
                for (int x = 0; x < image.width; x += 20) {
                    sampledColors.add(image.getRGB(x, y))
                }
            }
            if (sampledColors.size() < 12) {
                throw new GradleException("Visual harness produced a blank or near-blank sheet for ${relative}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(evidence.bytes).encodeHex().toString()
            if (!digests.add(digest)) {
                throw new GradleException("Visual harness produced a duplicate evidence sheet for ${relative}")
            }
        }
        def completion = new File(root, 'visual-harness-complete.json')
        if (!completion.isFile()) {
            throw new GradleException('Visual harness did not produce completion metadata')
        }
        def metadata = new groovy.json.JsonSlurper().parse(completion)
        if (metadata.status != 'complete' || metadata.resolution != [1600, 900]
            || metadata.fixtures != ['empty:0', 'single:1', 'mixed:12', 'dense:64']
            || metadata.captures != captures.collect { it.substring('screenshots/'.length()) }) {
            throw new GradleException('Visual harness completion metadata is not successful')
        }
    }
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, include: ['com/bettercontent/proceduralbouquets/data/**'])
        })
    )
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(tasks.named('jacocoTestReport', JacocoReport).map { it.classDirectories })
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.55
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
